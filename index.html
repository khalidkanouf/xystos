<!doctype html>
<html lang="fr" class="pwa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A2E35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="XYSTOS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>XYSTOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600&family=Doto:wght@100..900&display=swap">
<style>
/* Concept : relief doux, deux jumeaux clair et sombre. Surfaces extrudées, cadrans en creux, un arc orange qui avance, titres en Didone, chiffres en graisse 200. */
:root{
  --page:#E5E8EE; --ptx:#1F2A44; --pmu:#66708A; --pacc:#F26A21;
  --serif:'Doto','DotGothic16',ui-monospace,monospace; --sans:'Geist',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ptx);font-family:var(--sans);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:30px 60px;min-height:100vh}
.top{max-width:960px;margin:0 auto 34px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:800;font-size:28px;letter-spacing:.04em}
.brand span{font-family:var(--sans);font-weight:300;font-size:14px;color:var(--pmu);margin-left:10px;letter-spacing:.02em}
#pn{display:flex;gap:10px;flex-wrap:wrap}
#pn button{height:44px;padding:0 20px;border:0;border-radius:22px;background:var(--page);color:var(--pmu);font:inherit;font-size:14px;cursor:pointer;box-shadow:-5px -5px 11px #fff,6px 6px 13px #C3CAD7}
#pn button:active{box-shadow:inset 3px 3px 7px #C3CAD7,inset -3px -3px 7px #fff}
#pn button.on{color:var(--ptx);font-weight:500;box-shadow:inset 3px 3px 7px #C3CAD7,inset -3px -3px 7px #fff}
#pn button:focus-visible{outline:2px solid var(--pacc);outline-offset:3px}
.stage{display:flex;gap:64px;justify-content:center;flex-wrap:wrap}
.slot{width:372px;margin:0}
.slot figcaption{text-align:center;margin-top:20px;font-size:13px;color:var(--pmu);letter-spacing:.06em}
@media (max-width:420px){.slot{width:100%}.stage{gap:36px}}

/* appareil */
.dev{position:relative;width:100%;height:790px;border-radius:58px;border:8px solid #15181D;box-shadow:0 0 0 1.5px #7C8495,0 50px 60px -34px rgba(20,30,60,.5);overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--tx)}
.dev *{box-sizing:border-box}
.dev.lt{--bg:#EBEEF3;--hi:#FFFFFF;--lo:#C5CCD9;--tx:#1F2A44;--tx2:#5E6A82;--in:#E2E6ED;--ring:#CBD2DE;--acc:#F26A21;--glow:rgba(242,106,33,.32);--a2:#FFB24D}
.dev.dk{--bg:#2A2E35;--hi:#363B45;--lo:#191C21;--tx:#F3F5F9;--tx2:#9AA3B5;--in:#23262C;--ring:#454B57;--acc:#FF7A2E;--glow:rgba(255,122,46,.5);--a2:#FFC15E}
:where(.dev button){border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0}
.dev button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.isl{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:104px;height:30px;border-radius:20px;background:#000;z-index:8}
.stat{position:absolute;top:0;left:0;right:0;height:54px;padding:17px 30px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:500;z-index:4}
.stat span{display:flex;align-items:center;gap:6px}
.scr{position:absolute;top:54px;left:0;right:0;bottom:0;overflow-y:auto;padding:0 18px 150px;scrollbar-width:none;display:flex;flex-direction:column;gap:18px;z-index:2}
.scr::-webkit-scrollbar{display:none}
.scr>*{flex:none}
.fade{position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(180deg,transparent,var(--bg) 62%);z-index:3;pointer-events:none}
.hi{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:124px;height:4px;border-radius:2px;background:var(--tx);opacity:.85;z-index:6}

/* relief */
.rz{background:var(--bg);box-shadow:-6px -6px 14px var(--hi),7px 7px 16px var(--lo);border-radius:26px}
.in{background:var(--in);box-shadow:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi);border-radius:24px}
.rb{border-radius:50%;background:var(--bg);box-shadow:-5px -5px 12px var(--hi),6px 6px 14px var(--lo);display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.rb:active,.rz.bt:active{box-shadow:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi)}
.acc{color:var(--acc)}
.tx2{color:var(--tx2)}

/* titres */
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:relative}
.hd h1{font-family:var(--serif);font-weight:800;font-size:32px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.1}
.hd .sub{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--tx2);margin-top:8px}
.mb{width:54px;height:54px;border-radius:19px}
.menu{position:absolute;right:0;top:62px;width:200px;border-radius:24px;padding:8px;z-index:9}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;height:50px;padding:0 14px;border-radius:16px;font-size:15px;color:var(--tx2)}
.menu button.on{color:var(--tx);font-weight:500;box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.menu button i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.sw{display:flex;justify-content:center;align-items:baseline;gap:16px}
.sw button{font-size:15px;color:var(--tx2);height:44px;padding:0 4px}
.sw button.on{font-family:var(--serif);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--tx)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;height:46px;padding:0 12px;font-size:14px;color:var(--tx2);position:relative;white-space:nowrap}
.tabs button.on{color:var(--tx);font-weight:500}
.tabs button.on::after{content:"";position:absolute;left:18%;right:18%;bottom:2px;height:2px;border-radius:1px;background:var(--acc)}
.hn{font-weight:200;font-size:64px;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.hn em,.u{font-style:normal;font-size:15px;font-weight:400;color:var(--tx2);letter-spacing:0;margin-left:5px}
.lbl{font-size:12px;color:var(--tx2);letter-spacing:.02em}
.pill3{display:grid;grid-template-columns:repeat(3,1fr);padding:16px 8px;text-align:center}
.pill3 div{display:flex;flex-direction:column;gap:5px;position:relative}
.pill3 div+div::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--ring)}
.pill3 b{font-size:16px;font-weight:500;font-variant-numeric:tabular-nums}
.pill3 span{font-size:12px;color:var(--tx2)}
.duo{display:flex;justify-content:center;margin:0 auto;padding:14px 22px;gap:26px;width:max-content;max-width:100%}
.duo div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.duo b{font-weight:500;font-size:15px}
.wrap{position:relative;margin:0 auto}
.abs{position:absolute;display:flex;align-items:center;justify-content:center;transform:translate(-50%,-50%)}
.mk{width:46px;height:46px;border-radius:50%;font-size:15px;font-weight:500;color:var(--tx2)}
.mk.done{background:var(--in);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);color:var(--acc)}
.mk.cur{color:var(--acc);box-shadow:-5px -5px 12px var(--hi),6px 6px 14px var(--lo),0 0 0 2px var(--acc)}
.mk.todo{background:var(--bg);box-shadow:-4px -4px 9px var(--hi),5px 5px 11px var(--lo)}
.stepper{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sc{padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.sc .v{font-weight:300;font-size:36px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.sc .v em{font-style:normal;font-size:14px;color:var(--tx2);margin-left:4px;letter-spacing:0}
.sc .r{display:flex;gap:10px}
.sc .rb{width:54px;height:54px}
.sc .rb.p{color:var(--acc)}
.bars{display:flex;align-items:flex-end;gap:12px;height:120px;padding:0 6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:8px;background:var(--bg);box-shadow:-3px -3px 7px var(--hi),4px 4px 9px var(--lo)}
.bars i.on{background:var(--acc);box-shadow:0 0 18px var(--glow)}
.bars b{font-weight:400;font-size:11px;color:var(--tx2)}
.dif{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:0 26px;height:92px;border-radius:30px}
.dif b{display:block;font-family:var(--serif);font-weight:800;font-size:28px;letter-spacing:.04em;text-transform:uppercase}.dif span{font-size:13px;color:var(--tx2)}
.dif.sg b{color:var(--acc)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 20px;min-height:68px;width:100%;text-align:left;border-radius:24px}
.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-size:15px;font-weight:500}.row .nm span{font-size:12px;color:var(--tx2)}
.row .kc{font-size:14px;color:var(--tx2);font-variant-numeric:tabular-nums}
.ck{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--tx2);background:var(--bg);box-shadow:-3px -3px 7px var(--hi),4px 4px 9px var(--lo)}
.ck.on{color:var(--acc);background:var(--in);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.modes{display:flex;justify-content:space-around}
.modes button{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx2);background:var(--bg);box-shadow:-5px -5px 12px var(--hi),6px 6px 14px var(--lo)}
.modes button.on{color:var(--acc);background:var(--in);box-shadow:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi)}
.rate{display:flex;justify-content:space-between;gap:8px}
.rate button{width:52px;height:52px;border-radius:50%;font-size:17px;font-weight:300;display:flex;align-items:center;justify-content:center;background:var(--bg);box-shadow:-4px -4px 9px var(--hi),5px 5px 11px var(--lo)}
.rate button.on{color:var(--acc);font-weight:500;background:var(--in);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.chips button{height:48px;padding:0 20px;border-radius:24px;font-size:14px;color:var(--tx2);background:var(--bg);box-shadow:-4px -4px 9px var(--hi),5px 5px 11px var(--lo)}
.chips button.on{color:var(--acc);background:var(--in);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.note{font-size:14px;line-height:1.5;color:var(--tx2);text-align:center;padding:4px 10px}

.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px 12px 20px;min-height:76px;width:100%;text-align:left}
.set>div:first-child{min-width:0}.set b{display:block;font-size:15px;font-weight:500}.set>div:first-child span{font-size:12px;color:var(--tx2)}
.seg{display:flex;padding:4px;gap:4px;border-radius:26px;flex:none}
.seg button{width:76px;height:44px;border-radius:22px;font-size:13px;color:var(--tx2)}
.seg button.on{color:var(--acc);font-weight:500;background:var(--bg);box-shadow:-3px -3px 7px var(--hi),4px 4px 9px var(--lo)}
.swt{display:block;width:64px;height:36px;border-radius:18px;background:var(--in);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);position:relative;flex:none}
.swt i{position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:var(--bg);box-shadow:-2px -2px 5px var(--hi),3px 3px 7px var(--lo)}
.swt.on i{left:32px;background:var(--acc);box-shadow:0 0 14px var(--glow)}
.rs{display:flex;align-items:center;gap:6px;flex:none}.rs .rb{width:48px;height:48px}
.rs span{min-width:46px;text-align:center;font-size:16px;color:var(--tx);font-variant-numeric:tabular-nums}
/* barre d'action */
.act{position:absolute;left:14px;right:14px;bottom:18px;height:104px;display:grid;grid-template-columns:78px 1fr 78px;align-items:end;z-index:5}
.cb{display:flex;flex-direction:column;align-items:center;gap:8px}
.cb button{width:62px;height:62px}
.cb.m button{width:68px;height:68px;color:var(--acc)}
.cb span{font-size:11px;color:var(--tx2)}
.arc{min-width:0;align-self:end}
.arc svg{display:block;width:100%;height:auto}

.js{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;max-height:260px;overflow:auto;padding:14px;border-radius:20px;background:var(--in);box-shadow:inset 3px 3px 8px var(--lo),inset -3px -3px 8px var(--hi);color:var(--tx2);white-space:pre;margin:0;user-select:text}
.note.acc{color:var(--acc)}
.b12{position:relative;display:flex;align-items:stretch;gap:3px;height:170px;padding:0 2px}
.b12 button{flex:1;position:relative;min-width:0;border-radius:8px}
.b12 button.sel{background:var(--bg);box-shadow:-3px -3px 7px var(--hi),4px 4px 9px var(--lo)}
.b12 button b{left:0;right:0;text-align:center;font-weight:400;font-size:11px;color:var(--tx2)}
.b12 button.sel b{color:var(--acc)}
.b12 button i{display:block;border-radius:5px;background:var(--tx2);opacity:.55;margin:0 22%}
.b12 button i.proj{background:transparent;border:1.3px dashed var(--tx2);opacity:.8}
.dotsrow{display:flex;gap:10px;justify-content:center;align-items:center}
.dotsrow>i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--tx2);display:block}
.dotsrow>i.on{background:var(--acc);border-color:var(--acc);box-shadow:0 0 10px var(--glow)}
.dotsrow>i.cu{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}

/* séance : cadran rond dans une fenêtre hexagonale, anneau de N séries, rail, histogramme */
.s-top{display:flex;align-items:center;justify-content:space-between;height:46px;margin-top:2px}
.s-tt{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx);min-width:0}
.s-tt>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-tt .s-i{width:26px;height:26px;border-radius:9px;background:var(--in);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);display:flex;align-items:center;justify-content:center;color:var(--tx2);flex:none}
.s-ic{width:40px;height:40px;border-radius:14px;background:var(--bg);box-shadow:-3px -3px 8px var(--hi),4px 4px 10px var(--lo);display:flex;align-items:center;justify-content:center;color:var(--tx);flex:none}
.s-ic svg,.s-i svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.s-sub{font-size:11px;letter-spacing:.1em;color:var(--tx2);text-transform:uppercase;margin:-4px 0 0 2px}
.s-card{position:relative;height:282px;border-radius:40px;background:var(--bg);box-shadow:-5px -5px 12px var(--hi),6px 6px 14px var(--lo)}
.s-card svg.d{position:absolute;left:6px;top:14px;pointer-events:none}
.s-card .ico{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;color:var(--tx2);border-radius:50%}
.s-card .ico.on{color:var(--acc);filter:drop-shadow(0 0 6px var(--glow))}
.s-card .ico svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.s-card .ico.on svg{fill:currentColor;fill-opacity:.15}
.s-card .core{position:absolute;left:6px;top:14px;width:262px;height:254px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.s-card .core small{font-family:var(--serif);font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx2);margin-bottom:2px}
.s-card .core .n{font-weight:200;font-size:58px;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.s-card .core .u{font-size:13px;color:var(--tx2);margin-top:2px}
.s-card .disc{position:absolute;left:61px;top:65px;width:152px;height:152px;border-radius:50%}
.s-rail{position:absolute;right:16px;top:26px;bottom:26px;width:42px;border-radius:21px;background:var(--in);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 0}
.s-rail button{width:30px;height:30px;border-radius:50%;color:var(--tx2);font-size:17px;font-weight:200;background:var(--bg);box-shadow:-2px -2px 5px var(--hi),3px 3px 7px var(--lo);display:flex;align-items:center;justify-content:center}
.s-rail .tk{flex:1;width:1px;margin:7px 0;background:repeating-linear-gradient(var(--ring) 0 1px,transparent 1px 8px);position:relative}
.s-rail .tk i{position:absolute;left:-4px;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--glow)}
.s-vl{position:absolute;right:-4px;top:50%;transform:translate(100%,-50%) rotate(90deg);transform-origin:left center;font-size:9px;letter-spacing:.22em;color:var(--tx2);text-transform:uppercase;white-space:nowrap}
.s-hint{text-align:center;font-size:11px;letter-spacing:.03em;color:var(--tx2);margin-top:-4px}
.s-h{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx);padding:0 2px}
.s-h .s-i{width:24px;height:24px;border-radius:8px;background:var(--in);box-shadow:inset 2px 2px 4px var(--lo),inset -2px -2px 4px var(--hi);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.s-h .r{margin-left:auto;font-family:var(--sans);font-weight:400;font-size:11px;letter-spacing:0;text-transform:none;color:var(--tx2)}
.s-bars{position:relative;display:flex;align-items:flex-end;gap:7px;height:118px;padding:0 26px 0 2px}
.s-bars button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}
.s-bars i{display:block;width:100%;max-width:30px;border-radius:7px;background:var(--bg);box-shadow:-2px -2px 6px var(--hi),3px 3px 7px var(--lo)}
.s-bars i.on{background:var(--acc);box-shadow:0 0 12px var(--glow)}
.s-bars i.c{background:var(--in);box-shadow:inset 2px 2px 5px var(--lo),inset -2px -2px 5px var(--hi);border:1px solid var(--acc)}
.s-bars i.sel{outline:1.5px solid var(--tx);outline-offset:2px}
.s-bars em{font-style:normal;font-size:10px;color:var(--tx2);font-variant-numeric:tabular-nums}.s-bars em.a{color:var(--acc);font-weight:500}
.s-bars b{font-weight:400;font-size:9px;color:var(--tx2)}
.s-tabs{display:flex;justify-content:center;align-items:center;gap:30px;position:absolute;left:0;right:0;bottom:16px;z-index:5}
.s-tabs button{width:46px;height:46px;border-radius:15px;background:var(--bg);box-shadow:-3px -3px 8px var(--hi),4px 4px 10px var(--lo);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.s-tabs button.on{width:60px;height:60px;border-radius:20px;color:var(--acc);background:var(--in);box-shadow:inset 3px 3px 7px var(--lo),inset -3px -3px 7px var(--hi)}
.s-tabs svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.s-sw{display:flex;gap:30px}
.s-sw button{font-size:14px;color:var(--tx2);padding:10px 2px;position:relative}
.s-sw button.on{color:var(--tx)}.s-sw button.on::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:1.5px;background:var(--acc);box-shadow:0 0 8px var(--glow)}

var DBX=(function(){

  }

  /* ---------- Soir ---------- */
  function buildEntry(){

    if(sp&&d.status){var s={session_id:sp.session_id,status:d.status,sets:d.sets.slice()};if(d.reason)s.reason=d.reason;if(d.started){s.started_at=d.started;s.duration_min=d.dur}sessions.push(s)}
    var fl=mflags();

      morning:{sleep_h:m.sleep_h,energy:m.energy,pain:m.pain,plan_chosen:m.plan_chosen},

      other:{meals_done:fl.filter(Boolean).length,hydration_l:d.water*0.25,reading_min:d.rdBase+Math.floor(d.rdSec/60),work_min:Math.floor(d.wk.sec/60)}};

  function night(){

      '<div class="chips"><button data-a="jv">'+(S.jv?'Masquer le JSON':'Voir le JSON')+'</button><button data-a="sc" data-v="entry">Via Raccourci iCloud</button><button data-a="copy" data-v="entry">Copier</button><button data-a="exp" data-v="entry">Exporter</button></div>'+(S.hm?'<div class="note">'+S.hm+'</div>':'')+(S.jv?'<pre class="js" id="jsv">'+js.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</pre>':'');
    }

    var D_=['travail prolongé','douleur','imprévu'];
    var panel=S.tab===0?'<div class="lbl" style="margin:0 0 12px 4px">Satisfaction de la journée</div>'+rt('sat',d.ev.sat):S.tab===1?'<div class="lbl" style="margin:0 0 12px 4px">Fatigue ressentie</div>'+rt('fat',d.ev.fat):'<div class="lbl" style="margin:0 0 12px 4px">Perturbations</div><div class="chips">'+D_.map(function(x){return '<button class="'+(d.ev.dis.indexOf(x)>=0?'on':'')+'" data-a="dis" data-v="'+x+'">'+cap(x)+'</button>'}).join('')+'</div>';
    var id='g'+(++gid),sf=Math.min(1,sl/540);
    var ring='<svg width="250" height="250" viewBox="0 0 250 250" aria-hidden="true" style="position:absolute;left:0;top:0;overflow:visible"><defs><linearGradient id="'+id+'" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3C8CFF"/><stop offset=".55" stop-color="#A43FCB"/><stop offset="1" stop-color="#F0426E"/></linearGradient></defs><circle cx="125" cy="125" r="112" fill="none" style="stroke:var(--in)" stroke-width="16"/><circle cx="125" cy="125" r="112" fill="none" stroke="url(#'+id+')" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(2*Math.PI*112*sf).toFixed(1)+' 704" transform="rotate(-90 125 125)"/></svg>';
    return header('Coucher '+p.sleep.bedtime+' · lever '+p.sleep.wake)+
    '<div class="wrap" style="width:250px;height:250px">'+ring+'<div class="abs rb" style="left:125px;top:125px;width:176px;height:176px"><div class="in" style="width:138px;height:138px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span class="hn" style="font-size:40px;font-weight:300">'+hm(sl)+'</span><span class="lbl">de sommeil</span></div></div></div>'+
    '<div class="modes">'+[['smile','Satisfaction'],['batt','Fatigue'],['warn','Perturbations']].map(function(x,i){return '<button class="'+(S.tab===i?'on':'')+'" data-a="tab" data-v="'+i+'" aria-label="'+x[1]+'">'+ic(x[0],26,1.4)+'</button>'}).join('')+'</div>'+
    '<div class="in" style="padding:18px 16px;border-radius:28px">'+panel+'</div>'+(S.msg?'<div class="note acc">'+S.msg+'</div>':'');
  }

  /* ---------- Travail ---------- */
  function wkSegs(){
    var p=plan(),b=p&&p.work_blocks&&p.work_blocks[0];if(!b)return null;
    var eff=Math.max(15,b.minutes-D().wk.cut),segs=[],left=eff;
    while(left>=30){segs.push({ph:'focus',min:25},{ph:'pause',min:5});left-=30}
    if(left>=5)segs.push({ph:'focus',min:left});else if(segs.length)segs.pop();
    var foc=0;segs.forEach(function(s){if(s.ph==='focus')foc+=s.min});
    return {b:b,eff:eff,segs:segs,foc:foc};
  }
  function wkAdvance(d,step){
    var w=d.wk,sg=wkSegs();if(!sg||w.post)return;
    var cur=sg.segs[w.i];if(!cur){w.run=false;w.fin=true;return}
    if(w.t==null)w.t=cur.min*60;
    var use=Math.min(step,w.t);w.t-=use;if(cur.ph==='focus')w.sec+=use;
    if(w.t<=0){w.i++;var nx=sg.segs[w.i];if(!nx){w.run=false;w.fin=true;w.t=0}else w.t=nx.min*60}
  }
  function travail(){
    var day=dayOf(S.date);if(!day)return emptyDay('Cette date est hors de la fenêtre détaillée du programme.');
    var d=D(),sg=wkSegs(),w=d.wk;
    if(!d.m){ACT=actbar({a:'go',v:I_JOUR,i:'l',t:'Accueil'},{a:'go',v:I_JOUR,i:'ok',t:'Matin'},0.1,'Matin à faire');return header(dsub())+'<div class="rz" style="padding:26px 22px;text-align:center"><div class="note">Commence par l\'évaluation du matin : elle fixe le plan, donc la durée du bloc de travail.</div></div>'}
    if(!sg){ACT=actbar({a:'go',v:I_JOUR,i:'l',t:'Accueil'},{a:'go',v:I_LECT,i:'ok',t:'Lecture'},0.5,'Pas de bloc');return header(dsub())+'<div class="rz" style="padding:30px 22px;text-align:center"><div class="hn" style="font-size:44px;font-weight:300">Libre</div><div class="note" style="margin-top:12px">Aucun bloc de travail prévu aujourd\'hui.</div></div>'}
    if(w.post){ACT=actbar({a:'wback',i:'l',t:'Reprendre'},{a:'go',v:I_LECT,i:'ok',t:'Lecture'},0.5,'Reporté');return header('Bloc de '+sg.b.start)+'<div class="rz" style="padding:30px 22px;text-align:center"><div class="hn" style="font-size:44px;font-weight:300">Reporté</div><div class="note" style="margin-top:12px">Le bloc passe à demain. Le Mac en tiendra compte au prochain recalcul.</div></div>'}
    var cur=sg.segs[Math.min(w.i,sg.segs.length-1)];
    if(w.t==null&&!w.fin)w.t=cur.min*60;
    var nSp=sg.segs.filter(function(s){return s.ph==='focus'}).length,sp=Math.min(nSp,sg.segs.slice(0,w.i+1).filter(function(s){return s.ph==='focus'}).length);
    var frac=w.fin?0:w.t/(cur.min*60),mins=Math.floor(w.sec/60);
    ACT=actbar({a:'wcut',i:'minus',t:'Raccourcir'},w.fin?{a:'go',v:I_LECT,i:'ok',t:'Lecture'}:{a:'wtog',i:w.run?'pause':'play',t:w.run?'Pause':(w.sec?'Reprendre':'Démarrer')},sg.foc?w.sec/60/sg.foc:0,'Bloc de '+sg.eff+' min');
    var dots='<div class="dotsrow">';for(var i=0;i<nSp;i++)dots+='<i class="'+(i<sp-1||w.fin?'on':i===sp-1?'cu':'')+'"></i>';dots+='</div>';
    return header(dsub())+
    '<div class="wrap" style="width:250px;height:250px;margin-top:2px"><div id="wg">'+arcRing(250,Math.max(0.004,frac),10,w.run)+'</div><button class="abs rb" data-a="wtog" aria-label="Démarrer ou mettre en pause" style="left:125px;top:125px;width:178px;height:178px"><span class="in" style="width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><span id="wt" class="hn" style="font-size:40px;font-weight:300">'+(w.fin?'Fini':mmss(w.t))+'</span><span id="wl" class="lbl">'+(w.fin?'bloc terminé':cur.ph==='focus'?'Concentration':'Pause')+'</span></span></button></div>'+
    '<div class="rz" style="padding:16px 20px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl">Sprint '+sp+' sur '+nSp+' · 25 min + 5 min</span><span id="ws" style="font-size:15px">'+mins+' <span class="tx2">/ '+sg.foc+' min</span></span></div><div style="margin-top:14px">'+dots+'</div></div>'+
    '<div class="chips"><button data-a="wpost">Reporter à demain</button><button data-a="wcut">Raccourcir de 15 min</button></div>'+

  }

  /* ---------- Lecture ---------- */
  function readMin(dt){var d=S.ds[dt];if(d&&(d.rdBase||d.rdSec))return d.rdBase+Math.floor(d.rdSec/60);var h=histOn(dt);return h&&h.other&&h.other.reading_min!==undefined?h.other.reading_min:null}
  function histOn(dt){var r=null;S.hist.forEach(function(h){if(h.date===dt)r=h});if(!r&&S.sample)SAMPLE.forEach(function(h){if(h.date===dt)r=h});return r}
  function lecture(){
    var day=dayOf(S.date);if(!day)return emptyDay('Cette date est hors de la fenêtre détaillée du programme.');
    var d=D(),p=plan(),tgt=p.reading?p.reading.minutes:0,min=d.rdBase+Math.floor(d.rdSec/60),frac=tgt?Math.min(1,min/tgt):0;
    var st=0;for(var k=0;k<60;k++){var dt=addD(S.date,-k),m=readMin(dt);if(k===0&&(m===null||m<tgt)){continue}if(m!==null&&m>=tgt)st++;else break}
    var wd=(pd(S.date).getDay()+6)%7,monday=addD(S.date,-wd),row='<div class="dotsrow" style="gap:12px">';
    for(var i=0;i<7;i++){var dd=addD(monday,i),m2=dd===S.date?min:readMin(dd),t2=(dayOf(dd)&&dayOf(dd).plans.A.reading)?dayOf(dd).plans.A.reading.minutes:20;
      row+='<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><i style="width:22px;height:22px;border-radius:50%;display:block;'+(m2!==null&&m2>=t2?'background:var(--acc);box-shadow:0 0 10px var(--glow)':m2?'border:1.5px solid var(--acc)':'border:1.5px solid var(--ring)')+(dd===S.date?';outline:2px solid var(--tx2);outline-offset:3px':'')+'"></i><span class="lbl" style="font-size:11px">'+['L','M','M','J','V','S','D'][i]+'</span></div>'}
    row+='</div>';
    ACT=actbar({a:'go',v:I_JOUR,i:'l',t:'Accueil'},{a:'rtog',i:d.rdRun?'pause':'play',t:d.rdRun?'Pause':'Lire'},frac,min+' / '+tgt+' min');
    return header(dsub())+
    '<div class="wrap" style="width:250px;height:250px;margin-top:2px"><div id="rg2">'+arcRing(250,Math.max(0.004,frac),10,d.rdRun)+'</div><button class="abs rb" data-a="rtog" aria-label="Lancer ou arrêter la lecture" style="left:125px;top:125px;width:178px;height:178px"><span class="in" style="width:140px;height:140px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px"><span id="rt" class="hn" style="font-size:46px;font-weight:300">'+min+'</span><span id="rl" class="lbl">sur '+tgt+' min</span></span></button></div>'+
    '<div class="stepper">'+
      '<div class="rz sc"><span class="lbl">Minutes lues</span><span class="v" id="rv">'+min+'<em>min</em></span><div class="r"><button class="rb" data-a="radj" data-d="-5" aria-label="Moins 5 minutes">'+ic('minus',24,1.5)+'</button><button class="rb p" data-a="radj" data-d="5" aria-label="Plus 5 minutes">'+ic('plus',24,1.7)+'</button></div></div>'+
      '<div class="rz sc" style="justify-content:center"><span class="lbl">Série en cours</span><span class="v">'+st+'<em>jour'+(st>1?'s':'')+'</em></span><span class="lbl" style="text-align:center">objectif de '+tgt+' min par jour</span></div></div>'+
    '<div class="rz" style="padding:16px 18px"><div class="lbl" style="margin-bottom:14px">Cette semaine</div>'+row+'</div>';
  }

  /* ---------- Progression ---------- */
  function histList(){var m={};if(S.sample)SAMPLE.forEach(function(h){m[h.date]=h});S.hist.forEach(function(h){m[h.date]=h});return Object.keys(m).sort().map(function(k){return m[k]})}
  function weekOf(dt){return Math.floor(dayDiff(PROG.horizon.start,dt)/7)+1}
  var LIFTS=[['bench_press','Couché'],['squat','Squat'],['barbell_row','Rowing'],['overhead_press','Militaire']];
  function loadPlan(id){
    var arr=[],hard=null,W=PROG.horizon.weeks;
    for(var w=1;w<=W;w++){
      var found=null,dl=false;
      PROG.days.forEach(function(x){if(weekOf(x.date)===w){if(x.deload)dl=true;((x.plans.A.sport||{}).exercises||[]).forEach(function(e){if(e.id===id&&e.kind==='strength')found=e.load_kg})}});
      if(found!==null){arr[w]={v:found,proj:false};if(!dl)hard=found;continue}
      var sk=PROG.skeleton.filter(function(s){return s.week===w})[0];
      if(hard===null||!sk){arr[w]=null;continue}
      if(sk.deload)arr[w]={v:Math.round(hard*0.9*2)/2,proj:true};
      else{hard=Math.round(hard*(1+sk.load_progression_pct/100)*2)/2;arr[w]={v:hard,proj:true}}
    }
    return arr;
  }
  function progression(){
    var W=PROG.horizon.weeks,cw=Math.min(W,Math.max(1,weekOf(S.date))),sel=S.pw||cw,H=histList(),hw={};
    H.forEach(function(h){(hw[weekOf(h.date)]=hw[weekOf(h.date)]||[]).push(h)});
    ACT=actbar({a:'pwk',v:-1,i:'l',t:'Précédente'},{a:'pwk',v:1,i:'r',t:'Suivante'},sel/W,'Semaine '+sel+' sur '+W);
    var tabs='<div class="tabs">'+['Régularité','Charges','Sommeil'].map(function(n,i){return '<button class="'+(S.pt===i?'on':'')+'" data-a="ptab" data-v="'+i+'">'+n+'</button>'}).join('')+'</div>';
    var chart='',info='',chips='';
    if(S.pt===0){
      var mx=5,cols='',tp=0,td=0;
      for(var w=1;w<=W;w++){
        var pl=0;PROG.days.forEach(function(x){if(weekOf(x.date)===w&&x.plans.A.sport)pl++});
        if(!pl){var sk=PROG.skeleton.filter(function(s){return s.week===w})[0];pl=sk?sk.sessions:0}
        var dn=0;(hw[w]||[]).forEach(function(h){h.sessions.forEach(function(s){if(s.status==='completed'||s.status==='partial')dn++})});
        if(w<=cw){tp+=pl;td+=dn}
        cols+='<button class="'+(sel===w?'sel':'')+'" data-a="pw" data-v="'+w+'" aria-label="Semaine '+w+'"><i class="proj" style="height:'+Math.round(pl/mx*100)+'%;position:absolute;bottom:22px;left:0;right:0"></i><i style="height:'+Math.round(dn/mx*100)+'%;position:absolute;bottom:22px;left:0;right:0;background:var(--acc);box-shadow:0 0 10px var(--glow)"></i><b style="position:absolute;bottom:0">S'+w+'</b></button>';
        if(w===sel)info='S'+w+' · '+dn+' séance'+(dn>1?'s':'')+' faite'+(dn>1?'s':'')+' sur '+pl+' prévue'+(pl>1?'s':'');
      }
      chart='<div class="b12">'+cols+'</div>';
      chips='<div class="note">Réalisation depuis le début : <b style="color:var(--tx);font-weight:500">'+(tp?Math.round(td/tp*100):0)+' %</b> ('+td+' séances sur '+tp+').</div>';
    }else if(S.pt===1){
      var plan_=loadPlan(S.lift),mxL=0,cols2='';
      plan_.forEach(function(x){if(x&&x.v>mxL)mxL=x.v});
      for(var w2=1;w2<=W;w2++){
        var x=plan_[w2],act=0;(hw[w2]||[]).forEach(function(h){h.sessions.forEach(function(s){s.sets.forEach(function(t){if(t.exercise_id===S.lift&&t.load_kg>act)act=t.load_kg})})});
        cols2+='<button class="'+(sel===w2?'sel':'')+'" data-a="pw" data-v="'+w2+'" aria-label="Semaine '+w2+'">'+(x?'<i class="'+(x.proj?'proj':'')+'" style="height:'+Math.round(x.v/mxL*100)+'%;position:absolute;bottom:22px;left:0;right:0"></i>':'')+(act?'<i style="height:'+Math.round(act/mxL*100)+'%;position:absolute;bottom:22px;left:0;right:0;background:var(--acc);box-shadow:0 0 10px var(--glow)"></i>':'')+'<b style="position:absolute;bottom:0">S'+w2+'</b></button>';
        if(w2===sel)info='S'+w2+' · '+(x?f1(x.v)+' kg '+(x.proj?'projetés':'prévus'):'—')+(act?' · '+f1(act)+' kg soulevés':'');
      }
      chart='<div class="b12">'+cols2+'</div>';
      chips='<div class="chips" style="margin-top:4px">'+LIFTS.map(function(l){return '<button class="'+(S.lift===l[0]?'on':'')+'" data-a="lift" data-v="'+l[0]+'">'+l[1]+'</button>'}).join('')+'</div>';
    }else{
      var cols3='',tg=dur(plan().sleep.bedtime,plan().sleep.wake)/60;
      for(var w3=1;w3<=W;w3++){
        var xs=(hw[w3]||[]).map(function(h){return h.morning.sleep_h}),av=xs.length?xs.reduce(function(a,b){return a+b},0)/xs.length:0;
        cols3+='<button class="'+(sel===w3?'sel':'')+'" data-a="pw" data-v="'+w3+'" aria-label="Semaine '+w3+'">'+(av?'<i style="height:'+Math.round(av/9*100)+'%;position:absolute;bottom:22px;left:0;right:0;'+(av<tg-0.75?'background:var(--acc);box-shadow:0 0 10px var(--glow)':'')+'"></i>':'')+'<b style="position:absolute;bottom:0">S'+w3+'</b></button>';
        if(w3===sel)info='S'+w3+' · '+(av?f1(av.toFixed(1))+' h en moyenne':'pas de données');
      }
      chart='<div class="b12"><u style="position:absolute;left:0;right:0;bottom:calc(22px + '+(tg/9*100).toFixed(1)+'% * 0.8);height:0;border-top:1.5px dashed var(--tx2);opacity:.6"></u>'+cols3+'</div>';
      chips='<div class="note">Ligne pointillée : sommeil cible de '+f1(tg.toFixed(2))+' h. Orange : moyenne nettement sous la cible.</div>';

    '<div class="rz" style="padding:18px 22px;display:flex;align-items:center;gap:18px"><div class="wrap" style="width:96px;height:96px;margin:0;flex:none">'+arcRing(96,Math.max(0.02,cw/W),8,false,true)+'<div class="abs" style="left:48px;top:48px;font-weight:300;font-size:26px;letter-spacing:-.02em">S'+cw+'</div></div><div><div class="hn" style="font-size:34px">'+pr+'<em class="u" style="font-size:15px">% du cycle</em></div><div class="lbl" style="margin-top:6px">'+PROG.horizon.start+' → '+PROG.horizon.end+'</div></div></div>'+
    tabs+(S.pt===1?chips:'')+'<div class="in" style="padding:16px 12px 14px;border-radius:26px">'+chart+'<div style="text-align:center;font-size:14px;margin-top:12px">'+info+'</div></div>'+(S.pt===1?'':chips);
  }

  /* ---------- Réglages ---------- */
  function settings(){
    ACT=actbar({a:'go',v:0,i:'l',t:'Retour'},{a:'go',v:0,i:'ok',t:'Terminé'},0.5,'Réglages');
    var rows=[0,1,2,3,4,5,6].map(function(i){return '<div class="rz set"><div><b>'+SC[i]+'</b><span>'+(S.th[i]===DEF[i]?'Par défaut':'Modifié')+'</span></div><div class="seg in">'+['lt','dk'].map(function(m){return '<button class="'+(S.th[i]===m?'on':'')+'" data-a="th" data-k="'+i+'" data-v="'+m+'">'+(m==='lt'?'Clair':'Sombre')+'</button>'}).join('')+'</div></div>'}).join('');
    function tog(k,l,s,on){return '<button class="rz bt set" data-a="tog" data-k="'+k+'" role="switch" aria-checked="'+on+'"><div><b>'+l+'</b><span>'+s+'</span></div><span class="swt'+(on?' on':'')+'"><i></i></span></button>'}
    var hs=JSON.stringify(S.hist,null,2).replace(/&/g,'&amp;').replace(/</g,'&lt;');
    return header('Préférences')+
    '<div class="lbl" style="margin:0 0 -6px 6px">Programme</div>'+
    '<div class="rz set"><div><b>Application xystos-v7</b><span>Version installée sur ce téléphone</span></div></div>'+
    '<div class="rz set"><div><b>Révision '+PROG.revision+'</b><span>'+PROG.horizon.start+' → '+PROG.horizon.end+' · '+PROG.days.length+' jours détaillés</span></div></div>'+
    '<div class="chips"><button data-a="import">Importer un programme</button></div><input type="file" id="pf" accept="application/json,.json" hidden>'+(S.hm&&S.scr===4?'<div class="note">'+S.hm+'</div>':'')+
    '<div class="rz set"><div><b>Jour simulé</b><span>'+cap(fr(S.date))+'</span></div><div class="rs"><button class="rb" data-a="dd" data-v="-1" aria-label="Jour précédent">'+ic('minus',22,1.5)+'</button><button class="rb acc" data-a="dd" data-v="1" aria-label="Jour suivant">'+ic('plus',22,1.7)+'</button></div></div>'+
    DBX.panel()+'<div class="lbl" style="margin:6px 0 -6px 6px">Historique</div>'+
    '<div class="rz set"><div><b>'+S.hist.length+' journée'+(S.hist.length>1?'s':'')+' enregistrée'+(S.hist.length>1?'s':'')+'</b><span>Envoyées toutes seules si Dropbox est connecté</span></div></div>'+
    '<div class="chips"><button data-a="hv">'+(S.hv?'Masquer':'Voir le JSON')+'</button><button data-a="exp" data-v="all">Exporter tout</button><button data-a="copy" data-v="all">Tout copier</button><button data-a="hclear">Vider</button></div>'+(S.hv?'<pre class="js" id="jsv">'+hs+'</pre>':'')+
    '<div class="lbl" style="margin:6px 0 -6px 6px">Apparence par écran</div>'+rows+
    '<div class="chips"><button data-a="threset">Rétablir les réglages par défaut</button></div>'+
    '<div class="lbl" style="margin:6px 0 -6px 6px">En salle</div>'+
    tog('keep','Écran allumé','Pendant la séance, le travail et la lecture',S.keep)+
    tog('vib','Vibration','Indisponible sur iPhone en application web',S.vib)+
    tog('demo','Minuteurs accélérés','Démo : 1 s compte pour 1 min',S.demo)+
    tog('sample','Historique d\'exemple','Deux semaines dans Progression et Lecture',S.sample)+
    '<div class="rz set"><div><b>Repos par défaut</b><span>Repli si le programme n\'en fixe pas</span></div><div class="rs"><button class="rb" data-a="rest" data-d="-15" aria-label="Moins">'+ic('minus',22,1.5)+'</button><span>'+mmss(S.rest)+'</span><button class="rb acc" data-a="rest" data-d="15" aria-label="Plus">'+ic('plus',22,1.7)+'</button></div></div>';
  }

  var wl=null;
  function saveDs(){try{localStorage.setItem('xystos-ds',JSON.stringify(S.ds))}catch(e){}}
  function keepAwake(){
    var want=S.keep&&(S.scr===I_SEANCE||S.scr===I_TRAV||S.scr===I_LECT);
    try{
      if(want&&!wl&&navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){wl=null})}).catch(function(){})}
      else if(!want&&wl){wl.release();wl=null}
    }catch(e){}
  }
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')keepAwake()});
  function render(){
    var old=root.querySelector('.scr'),sc=old?old.scrollTop:0;
    root.className='dev '+S.th[S.scr];
    var body=[home,workout,nut,travail,lecture,night,progression,settings][S.scr]();
    root.innerHTML='<div class="isl"></div><div class="stat"><span>9:41</span><span><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="26" height="12" viewBox="0 0 26 12" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".55"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/></svg></span></div><div class="scr">'+body+'</div>'+ACT+'<div class="hi"></div>';
    var nw=root.querySelector('.scr');if(nw)nw.scrollTop=sc;
    var tb=root.querySelector('.tabs button.on');if(tb&&tb.scrollIntoView)tb.scrollIntoView({inline:'center',block:'nearest'});
    saveDs();keepAwake();
    if(onChange)onChange(S.scr,S.th[S.scr],S.date);
  }
  var tk=null;
  function ensureTk(){var any=Object.keys(S.ds).some(function(k){return S.ds[k].wk.run||S.ds[k].rdRun});if(any&&!tk)tk=setInterval(tickAll,1000);if(!any&&tk){clearInterval(tk);tk=null}}
  function tickAll(){var step=S.demo?60:1;Object.keys(S.ds).forEach(function(k){var d=S.ds[k];if(d.wk.run)wkAdvance(d,step);if(d.rdRun)d.rdSec+=step});updTimers();ensureTk()}
  function updTimers(){
    var d=D();
    if(S.scr===I_TRAV){
      var sg=wkSegs(),w=d.wk;if(!sg)return;
      if(w.fin||S._wi!==w.i){S._wi=w.i;render();return}
      var cur=sg.segs[Math.min(w.i,sg.segs.length-1)],t=root.querySelector('#wt'),l=root.querySelector('#wl'),g=root.querySelector('#wg'),sx=root.querySelector('#ws');
      if(t&&w.t!=null)t.textContent=mmss(w.t);if(l)l.textContent=cur.ph==='focus'?'Concentration':'Pause';
      if(g)g.innerHTML=arcRing(250,Math.max(0.004,w.t/(cur.min*60)),10,w.run);
      if(sx)sx.innerHTML=Math.floor(w.sec/60)+' <span class="tx2">/ '+sg.foc+' min</span>';
    }else if(S.scr===I_LECT){
      var p=plan(),tgt=p&&p.reading?p.reading.minutes:0,min=d.rdBase+Math.floor(d.rdSec/60),rt=root.querySelector('#rt'),rv=root.querySelector('#rv'),rg=root.querySelector('#rg2');
      if(rt)rt.textContent=min;if(rv)rv.innerHTML=min+'<em>min</em>';if(rg)rg.innerHTML=arcRing(250,Math.max(0.004,tgt?Math.min(1,min/tgt):0),10,d.rdRun);
    }
  }
  function upd(){var a=root.querySelector('#tm'),r=root.querySelector('#rg'),c=root.querySelector('#rgc'),nx=root.querySelector('#nx');if(a)a.textContent=mmss(S.t);if(r)r.innerHTML=arcRing(250,S.t/S.tot,10,true);if(c){var q=Math.max(0,Math.min(1,S.t/S.tot))*100;c.setAttribute('stroke-dasharray',q.toFixed(1)+' '+(100-q).toFixed(1))}if(nx){var ce=curEx();nx.textContent=ce&&exDone(ce)<total(ce)?'série '+(exDone(ce)+1)+' dans '+mmss(S.t):'exercice suivant'}}
  function go(n){stop();if(S.ph==='rest')S.ph='set';S.menu=false;S.scr=n;S.msg='';if(n===1&&exs().length)initEx();render()}
  function startRest(e){S.ph='rest';S._d30=0;S.met='rest';S.sel=undefined;S.t=restOf(e);S.tot=S.t;render();stop();tm=setInterval(function(){S.t--;if(S.t>0&&S.t<=3)beep(880,90);if(S.t<=0){beep(1320,320);nextAfterRest();return}upd()},1000)}
  function nextAfterRest(){stop();var e=curEx();if(e&&exDone(e)>=total(e))nextEx();S.ph='set';S.met='rep';S.sel=undefined;render()}
  function railAdj(dir){var e=curEx(),d=D(),m=S.met;if(S.ph==='rest'&&m==='rest'){S.t=Math.max(5,S.t+15*dir);S.tot=Math.max(S.tot,S.t);upd();return}
    if(m==='rep'){if(S.ph==='rest'){var i=setIdx(e);if(i>=0)d.sets[i].reps=Math.max(0,d.sets[i].reps+dir)}S.reps=Math.max(0,S.reps+dir)}
    else if(m==='kg'){S.kg=Math.max(0,Math.round((S.kg+2.5*dir)*10)/10)}
    else if(m==='rest'){S.ov=S.ov||{};S.ov[e.id]=Math.max(15,restOf(e)+15*dir)}
    render()}
  function finishSession(st,reason){var d=D();d.status=st;if(reason)d.reason=reason;if(d.started)d.dur=Math.max(1,Math.round((Date.now()-d.t0)/60000));S.ph='fin';render()}
  function begin(){var d=D();if(!d.started){d.started=tzIso(S.date);d.t0=Date.now()}}
  function setDate(dt){stop();Object.keys(S.ds).forEach(function(k){S.ds[k].wk.run=false;S.ds[k].rdRun=false});ensureTk();S.pw=0;S._wi=undefined;S.date=dt;S.ph='set';S.msg='';S.jv=false;initEx();render()}
  function copy(txt){
    function ok(){S.hm='Copié dans le presse-papiers.';render()}
    function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();var r=false;try{r=document.execCommand('copy')}catch(e){}document.body.removeChild(ta);S.hm=r?'Copié dans le presse-papiers.':'Copie refusée : sélectionne le texte du JSON.';render()}
    try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(e){fb()}
  }

  root.addEventListener('change',function(e){
    if(e.target.id!=='pf'||!e.target.files[0])return;
    var rd=new FileReader();
    rd.onload=function(){try{var o=JSON.parse(rd.result);if(o.schema!==1||!Array.isArray(o.days)||!o.horizon||!o.constraints)throw 0;PROG=o;try{localStorage.setItem('xystos-prog',JSON.stringify(o))}catch(e){}S.ds={};S.date=o.horizon.start;S.hm='Programme importé · révision '+o.revision+'.'}catch(x){S.hm='Fichier non reconnu : ce n\'est pas un programme.json valide.'}render()};
    rd.readAsText(e.target.files[0]);
  });
  root.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');
    if(!b||!root.contains(b)){if(S.menu){S.menu=false;render()}return}
    var a=b.getAttribute('data-a'),v=b.getAttribute('data-v'),k=b.getAttribute('data-k'),dd=parseFloat(b.getAttribute('data-d')),d=D();
    if(a==='menu'){S.menu=!S.menu;render();return}
    if(a==='go'){go(+v);return}
    if(a==='wtog'){var sg0=wkSegs();if(!sg0||d.wk.fin||d.wk.post)return;d.wk.run=!d.wk.run;S._wi=d.wk.i;ensureTk();render();return}
    if(a==='wcut'){d.wk.cut=Math.min(60,d.wk.cut+15);var sg1=wkSegs();if(sg1&&d.wk.i>=sg1.segs.length){d.wk.i=sg1.segs.length-1;d.wk.t=Math.min(d.wk.t==null?1e9:d.wk.t,sg1.segs[d.wk.i].min*60)}render();return}
    if(a==='wpost'){d.wk.post=true;d.wk.run=false;ensureTk();render();return}
    if(a==='wback'){d.wk.post=false;render();return}
    if(a==='rtog'){d.rdRun=!d.rdRun;ensureTk();render();return}
    if(a==='radj'){d.rdBase=Math.max(0,d.rdBase+dd);render();return}
    if(a==='pw'){S.pw=+v;render();return}
    if(a==='pwk'){S.pw=Math.max(1,Math.min(PROG.horizon.weeks,(S.pw||Math.max(1,weekOf(S.date)))+(+v)));render();return}
    if(a==='ptab'){S.pt=+v;render();return}
    if(a==='lift'){S.lift=v;render();return}
    if(a==='ddstart'){setDate(PROG.horizon.start);return}
    if(a==='dd'){var t=addD(S.date,+v);if(t<PROG.horizon.start)t=PROG.horizon.start;if(t>PROG.detailed_until)t=PROG.detailed_until;setDate(t);return}
    if(a==='plan'){if(d.m){d.m.plan_chosen='ABC'[(pidx()+1)%3];initEx()}else{d.msd.plan=(d.msd.plan+1)%3;d.msd.manual=true}render();return}
    if(a==='sl'||(a==='adj'&&k==='sl')){d.msd.sleep=Math.max(3,Math.min(12,d.msd.sleep+dd));if(!d.msd.manual)d.msd.plan=suggest(d.msd);render();return}
    if(a==='en'){d.msd.energy=+v;if(!d.msd.manual)d.msd.plan=suggest(d.msd);render();return}
    if(a==='pz'){var i=d.msd.pain.indexOf(v);if(i<0)d.msd.pain.push(v);else d.msd.pain.splice(i,1);if(!d.msd.manual)d.msd.plan=suggest(d.msd);render();return}
    if(a==='pl'){d.msd.lvl=+v;if(!d.msd.manual)d.msd.plan=suggest(d.msd);render();return}
    if(a==='mok'){var m=d.msd;d.m={sleep_h:m.sleep,energy:m.energy,pain:m.pain.map(function(z){return{zone:z,level:m.lvl}}),plan_chosen:'ABC'[m.plan]};initEx();render();return}
    if(a==='adj'){if(k==='kg')S.kg=Math.max(0,Math.round((S.kg+dd)*10)/10);else if(k==='reps')S.reps=Math.max(0,S.reps+dd);else d.water=Math.max(0,Math.min(24,d.water+dd));render();return}
    if(a==='th'){S.th[+k]=v;saveTh(S.th);render();return}
    if(a==='threset'){S.th=DEF.slice();saveTh(S.th);render();return}
    if(a==='tog'){S[k]=!S[k];render();return}
    if(a==='rest'){S.rest=Math.max(30,Math.min(300,S.rest+dd));render();return}
    if(a.indexOf('dbx')===0){DBX.action(a);return}
    if(a==='import'){var f=root.querySelector('#pf');if(f)f.click();return}
    if(a==='hv'){S.hv=!S.hv;S.hm='';render();return}
    if(a==='jv'){S.jv=!S.jv;S.hm='';render();return}
    if(a==='hclear'){S.hist=[];saveHist(S.hist);S.hm='';render();return}
    if(a==='exp'){exportFiles(v==='all'?S.hist:[d.entry]);return}
    if(a==='sc'){location.href='shortcuts://run-shortcut?name='+encodeURIComponent('XYSTOS Journée')+'&input=text&text='+encodeURIComponent(JSON.stringify(d.entry));return}
    if(a==='copy'){copy(v==='all'?JSON.stringify(S.hist,null,2):JSON.stringify(d.entry,null,2));return}
    if(a==='pickex'){pick(+v);S.sel=undefined;if(S.ph==='list')S.ph='set';render();return}
    if(a==='stab'){var tb=+v;if(tb===1&&S.ph==='rest'){nextAfterRest();return}stop();S.ph=tb===0?'list':tb===1?'set':'cfg';render();return}
    if(a==='met'){S.met=v;render();return}
    if(a==='rail'){railAdj(+v);return}
    if(a==='fb'){var q=+v,e4=curEx(),i4=setIdx(e4);S.fbq=q;if(i4>=0)d.sets[i4].difficulty=[-1,0,2][q];if(q===2&&S.auto&&!S._d30){S._d30=1;S.t+=30;S.tot+=30}render();return}
    if(a==='bar'){if(S.ph==='rest'&&+v<exDone(curEx())){S.sel=+v;S.met='rep';render()}return}
    if(a==='rov'){var e5=curEx();S.ov=S.ov||{};S.ov[e5.id]=Math.max(15,restOf(e5)+(+v));render();return}
    if(a==='rcfg'){if(v==='beep')S.beep=!S.beep;else if(v==='auto')S.auto=!S.auto;render();return}
    if(a==='fin2'){if(d.sets.length&&!confirm('Terminer la séance ?'))return;if(!d.sets.length){S.ph='reason';render()}else finishSession(allDone()?'completed':'partial');return}
    if(a==='sdone'){var e2=curEx();begin();var n2=exDone(e2)+1;
      if(e2.kind==='strength')d.sets.push({exercise_id:e2.id,set:n2,reps:S.reps,load_kg:S.kg,difficulty:0});
      else d.sets.push(e2.duration_s?{exercise_id:e2.id,set:n2,duration_s:e2.duration_s}:{exercise_id:e2.id,set:n2,reps:e2.reps.min});
      d.done[e2.id]=n2;S.fbq=1;S.sel=undefined;
      if(allDone()){finishSession('completed');return}
      if(e2.kind==='strength'||(e2.kind==='core'&&n2<e2.sets)){startRest(e2);return}
      nextEx();S.met='rep';render();return}
    if(a==='nextex'){nextEx();render();return}
    if(a==='done'){S.ph='diff';render();return}
    if(a==='back'){S.ph='set';render();return}
    if(a==='diff'){
      var e2=curEx(),q=+v;begin();var n=exDone(e2)+1;
      d.sets.push({exercise_id:e2.id,set:n,reps:S.reps,load_kg:S.kg,difficulty:[-1,0,2][q]});d.done[e2.id]=n;
      S.fb=['Noté : charge relevée au prochain recalcul.','Noté : dans la cible.','Noté : charge allégée au prochain recalcul.'][q];
      if(allDone()){finishSession('completed');return}
      startRest(e2);return}
    if(a==='mdone'){var e3=curEx();begin();var n3=exDone(e3)+1;d.sets.push(e3.duration_s?{exercise_id:e3.id,set:n3,duration_s:e3.duration_s}:{exercise_id:e3.id,set:n3,reps:e3.reps.min});d.done[e3.id]=n3;if(allDone()){finishSession('completed');return}if(e3.kind==='core'&&n3<e3.sets){startRest(e3);return}nextEx();render();return}
    if(a==='p30'){S.t+=30;S.tot+=30;upd();return}
    if(a==='skip'){nextAfterRest();return}
    if(a==='finish'){if(!d.sets.length){S.ph='reason';render()}else finishSession(allDone()?'completed':'partial');return}
    if(a==='reason'){finishSession('skipped',v);return}
    if(a==='meal'){var fl=mflags();fl[+v]=fl[+v]?0:1;render();return}
    if(a==='nextmeal'){var f2=mflags(),mi=f2.indexOf(0);if(mi>=0)f2[mi]=1;render();return}
    if(a==='unmeal'){var f3=mflags(),li=f3.lastIndexOf(1);if(li>=0)f3[li]=0;render();return}
    if(a==='sat'){d.ev.sat=+v;render();return}
    if(a==='fat'){d.ev.fat=+v;render();return}
    if(a==='tab'){S.tab=+v;render();return}
    if(a==='dis'){var j=d.ev.dis.indexOf(v);if(j<0)d.ev.dis.push(v);else d.ev.dis.splice(j,1);render();return}
    if(a==='reset'){d.ev={sat:3,fat:3,dis:[]};S.msg='';render();return}
    if(a==='express'){
      var dy=dayOf(S.date),pl=v==='allege'?'B':'A',spx=dy.plans[pl].sport,sx=[];
      d.m={sleep_h:7,energy:3,pain:[],plan_chosen:pl};
      if(spx&&(v==='fait'||v==='allege')){
        spx.exercises.forEach(function(e){
          if(e.kind==='strength'||e.kind==='core'){for(var i=1;i<=e.sets;i++){var o={exercise_id:e.id,set:i,reps:(e.reps&&e.reps.max)||10,difficulty:0};if(e.load_kg!=null)o.load_kg=e.load_kg;sx.push(o)}}
          else if(e.duration_s){sx.push({exercise_id:e.id,set:1,duration_s:e.duration_s,difficulty:0})}
        });
        d.status='completed';d.sets=sx;d.reason=null;
      }else if(v==='non'){d.status='skipped';d.reason='temps';d.sets=[]}
      var nm=dy.plans[pl].nutrition.meals.length;d.meals=[];for(var j=0;j<nm;j++)d.meals.push(1);
      d.entry=buildEntry();d.saved=true;S.hist=S.hist.filter(function(h){return h.date!==S.date});S.hist.push(d.entry);S.hist.sort(function(x,y){return x.date<y.date?-1:1});saveHist(S.hist);DBX.envoyer(d.entry);S.msg='';S.hm='';S.scr=5;render();return}
    if(a==='save'){
      if(!d.m){S.msg='Fais d\'abord l\'évaluation du matin.';render();return}
      d.entry=buildEntry();d.saved=true;S.hist=S.hist.filter(function(h){return h.date!==S.date});S.hist.push(d.entry);S.hist.sort(function(x,y){return x.date<y.date?-1:1});saveHist(S.hist);DBX.envoyer(d.entry);S.msg='';S.hm='';render();return}
    if(a==='unsave'){d.saved=false;render();return}
  });
  initEx();render();
  DBX.demarrer({redraw:function(){render()},getProg:function(){return PROG},applyProg:function(o){PROG=o;try{localStorage.setItem('xystos-prog',JSON.stringify(o))}catch(e){}if(S.date<o.horizon.start||S.date>o.detailed_until)S.date=todayClamp();render()}});
  return {go:go,state:function(){return S},prog:function(){return PROG}};
}

var pn=document.getElementById('pn'),cap_=document.getElementById('cap'),pa,cur=0;
function drawNav(){pn.innerHTML=SC.map(function(n,i){return '<button class="'+(i===cur?'on':'')+'" data-i="'+i+'">'+n+'</button>'}).join('')}
pn.addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(!b)return;pa.go(+b.getAttribute('data-i'))});
pa=Phone(document.getElementById('pa'),function(s,t,dt){cur=s;drawNav();cap_.textContent=SC[s]+' · '+(t==='lt'?'clair':'sombre')+' · '+cap(fr(dt))});
window.xystos=pa;
})();
